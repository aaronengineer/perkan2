services:
  perkan:
    build: .
    image: aaronengineer/perkan2
    ports:
      - "${HOST_PORT:-5000}:5000"
    # Google Calendar sync polls on a background thread per worker process;
    # keep this at 1 worker if GOOGLE_CLIENT_ID is set, or duplicate API
    # calls will happen (harmless, but noisy) until they settle down.
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "2", "--threads", "4", "--timeout", "60", "app:app"]
    volumes:
      - perkan-data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://127.0.0.1:5000/auth/google/callback}
      - GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID:-primary}
      - GCAL_TIMEZONE=${GCAL_TIMEZONE:-UTC}
      - GCAL_SYNC_INTERVAL_SECONDS=${GCAL_SYNC_INTERVAL_SECONDS:-60}
      - GCAL_IMPORT_NEW_EVENTS=${GCAL_IMPORT_NEW_EVENTS:-true}
      - GCAL_DEFAULT_COLUMN=${GCAL_DEFAULT_COLUMN:-todo}
      - GCAL_SYNC_WINDOW_DAYS=${GCAL_SYNC_WINDOW_DAYS:-90}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  perkan-data:
