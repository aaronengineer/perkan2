<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Task List - Personal Kanban</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/list.css">
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
  </head>
  <body class="list-view-page">
    <header>
      <div class="header-top">
        <div class="view-switcher">
          <a href="/" class="view-link">🎯 Board</a>
          <span class="view-link active">📋 List</span>
        </div>
        <div id="projectFilters" class="project-filters" aria-live="polite"></div>
        <button id="truncateBtn" title="Toggle card truncation" aria-pressed="false">📋 Truncate</button>
        <button id="settingsBtn" title="Board settings">⚙️ Settings</button>
        {% if current_user %}
        <div class="header-user">
          <span class="header-user-name">{{ current_user.display_name }}</span>
          <form method="POST" action="/logout" style="margin:0">
            <button type="submit" class="header-logout-btn">Log out</button>
          </form>
        </div>
        {% endif %}
      </div>
    </header>
    <main id="listView" class="list-view">
      <!-- Table renders here -->
    </main>

    <script>window.PERKAN_CURRENT_USER = {{ (current_user or None) | tojson }};</script>
    <script src="/static/app.js"></script>
    <script src="/static/list.js"></script>
  </body>
</html>
